<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esteira Torre Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — topbar, dark side rail with inbox tree, scrolling work area. Steel-blue ink + signal orange from obra/engenharia. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7f9; --surface-3:#e7ebf0;
  --ink:#17202a; --ink-2:#47525f; --ink-3:#7a8592; --line:#d8dee5; --line-2:#c5cdd6;
  --nav:#162230; --nav-2:#1e2d3d; --nav-ink:#b9c5d1; --nav-ink-2:#7f8fa0; --nav-hi:#ffffff;
  --accent:#d4691e; --accent-ink:#ffffff; --accent-soft:#fbe9dc; --accent-strong:#a94f10;
  --link:#225d9c;
  --ok:#2d7a4f; --ok-bg:#e0f1e7; --warn:#9a6a0b; --warn-bg:#fbf0d4; --bad:#b8322f; --bad-bg:#f9e1e0; --info:#2862a3; --info-bg:#e1ecf8;
  --s-laudo:#2862a3; --s-asbuilt:#7046b0; --s-evtl:#13807a; --s-bens:#5c7a1c; --s-correcao:#b8322f; --s-adm:#b5651d;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2632; --surface-3:#22303e;
  --ink:#e5eaf0; --ink-2:#a8b3bf; --ink-3:#7a8794; --line:#283543; --line-2:#344454;
  --nav:#0a1016; --nav-2:#141e29; --nav-ink:#a9b6c3; --nav-ink-2:#6b7b8c; --nav-hi:#ffffff;
  --accent:#e8843f; --accent-ink:#1a0f06; --accent-soft:#3a2516; --accent-strong:#f2a066;
  --link:#7fb2ea;
  --ok:#6cc895; --ok-bg:#16301f; --warn:#e3b54a; --warn-bg:#33290f; --bad:#f07b77; --bad-bg:#3a1a1a; --info:#7fb2ea; --info-bg:#162a40;
  --s-laudo:#7fb2ea; --s-asbuilt:#b294ea; --s-evtl:#5cc9c0; --s-bens:#a5c45b; --s-correcao:#f07b77; --s-adm:#e8a15a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2632; --surface-3:#22303e;
  --ink:#e5eaf0; --ink-2:#a8b3bf; --ink-3:#7a8794; --line:#283543; --line-2:#344454;
  --nav:#0a1016; --nav-2:#141e29; --nav-ink:#a9b6c3; --nav-ink-2:#6b7b8c; --nav-hi:#ffffff;
  --accent:#e8843f; --accent-ink:#1a0f06; --accent-soft:#3a2516; --accent-strong:#f2a066;
  --link:#7fb2ea;
  --ok:#6cc895; --ok-bg:#16301f; --warn:#e3b54a; --warn-bg:#33290f; --bad:#f07b77; --bad-bg:#3a1a1a; --info:#7fb2ea; --info-bg:#162a40;
  --s-laudo:#7fb2ea; --s-asbuilt:#b294ea; --s-evtl:#5cc9c0; --s-bens:#a5c45b; --s-correcao:#f07b77; --s-adm:#e8a15a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}
.muted{color:var(--ink-3)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ---------- shell ---------- */
#app{height:100%}
.app{height:100%;display:grid;grid-template-columns:272px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"top top" "nav main"}
.app.client{grid-template-columns:1fr;grid-template-areas:"top" "main"}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--nav);color:var(--nav-ink);border-bottom:1px solid var(--nav-2);min-width:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--nav-hi);white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark .i{width:20px;height:20px;stroke-width:2}
.brand b{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.brand span{font-size:12px;color:var(--nav-ink-2);border-left:1px solid var(--nav-2);padding-left:10px;letter-spacing:.04em}
.gsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--nav-2);border:1px solid transparent;border-radius:7px;padding:0 10px;height:36px;min-width:0}
.gsearch:focus-within{border-color:var(--accent)}
.gsearch input{flex:1;background:none;border:0;outline:0;color:var(--nav-hi);min-width:0}
.gsearch input::placeholder{color:var(--nav-ink-2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:7px;background:none;border:0;color:var(--nav-ink)}
.iconbtn:hover{background:var(--nav-2);color:var(--nav-hi)}
.badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px/17px var(--f-body);text-align:center}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--nav-2);border:1px solid var(--nav-2);color:var(--nav-hi);border-radius:7px;height:36px;padding:0 8px;max-width:210px}
.who label{font-size:11px;color:var(--nav-ink-2);text-transform:uppercase;letter-spacing:.06em}
.hamb{display:none}

/* ---------- side nav ---------- */
.nav{grid-area:nav;background:var(--nav);color:var(--nav-ink);overflow-y:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--nav-2)}
.nav .cta{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-bottom:10px}
.nav .cta:hover{filter:brightness(1.07)}
.nav h4{margin:16px 8px 6px;font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--nav-ink-2);display:flex;justify-content:space-between}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:6px;border:0;background:none;color:var(--nav-ink);text-align:left}
.ni:hover{background:var(--nav-2);color:var(--nav-hi)}
.ni.on{background:var(--nav-2);color:var(--nav-hi);box-shadow:inset 3px 0 0 var(--accent)}
.ni .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--nav-ink-2);font-variant-numeric:tabular-nums}
.ni.on .n{color:var(--nav-hi)}
.ni .n.hot{color:var(--accent)}
.ni .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree{display:flex;flex-direction:column;gap:1px}
.tnode{display:flex;align-items:center}
.tnode .tog{width:22px;height:28px;display:grid;place-items:center;background:none;border:0;color:var(--nav-ink-2);flex:none}
.tnode .tog .i{width:13px;height:13px;transition:transform .15s}
.tnode .tog.open .i{transform:rotate(90deg)}
.tnode .tog.none{visibility:hidden}
.tnode .ni{padding:5px 8px 5px 4px;font-size:13px}
.tkids{padding-left:22px;display:flex;flex-direction:column}
.tkids .ni{font-size:12.5px;padding:4px 8px;color:var(--nav-ink-2)}
.tkids .ni:hover,.tkids .ni.on{color:var(--nav-hi)}
.navfoot{margin-top:auto;padding:16px 8px 0;font-size:12px;color:var(--nav-ink-2);display:flex;flex-direction:column;gap:8px}
.navfoot button{background:none;border:1px solid var(--nav-2);color:var(--nav-ink);border-radius:6px;padding:6px 8px;text-align:left}
.navfoot button:hover{border-color:var(--nav-ink-2)}
.dot-l{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- main ---------- */
.main{grid-area:main;overflow-y:auto;min-width:0}
.page{padding-block:22px 48px;padding-inline:24px;max-width:1480px;margin:0 auto}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.phead .sub{color:var(--ink-3);font-size:13px}
.phead .sp{flex:1}
.eyebrow{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--surface-3);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.tag-new{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--info);color:var(--surface);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);white-space:nowrap}
.setor{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sc,var(--ink-2));white-space:nowrap}
.s-laudo{--sc:var(--s-laudo)} .s-asbuilt{--sc:var(--s-asbuilt)} .s-evtl{--sc:var(--s-evtl)} .s-bens{--sc:var(--s-bens)} .s-correcao{--sc:var(--s-correcao)} .s-adm{--sc:var(--s-adm)} .s-cliente{--sc:var(--ink-2)}

.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h) 42% 46%);color:#fff;font:600 11.5px/1 var(--f-body);letter-spacing:.02em;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.off{opacity:.5;filter:grayscale(1)}
.av.av-none{background:none;border:1px dashed var(--line-2);color:var(--ink-3)}

/* list table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.list{width:100%;border-collapse:collapse;min-width:980px}
.list th{position:sticky;top:0;background:var(--surface-2);text-align:left;font:600 12px var(--f-body);color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--surface-2)}
.list .num{font:500 13px var(--f-mono);color:var(--ink-3)}
.list .ttl{font-weight:500;color:var(--ink);margin:3px 0 6px;line-height:1.35}
.list .dt{font:12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.rowtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rowcancel td{opacity:.6}

/* progress dots (like the original but readable) */
.dots{display:flex;align-items:center;gap:3px}
.dots i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--surface)}
.dots i.done{background:var(--accent);border-color:var(--accent)}
.dots i.done::after{content:"";width:6px;height:3.5px;border-left:1.6px solid var(--accent-ink);border-bottom:1.6px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.dots i.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dots i.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.wait{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.dots i.wait::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.dots b{width:6px;height:1.5px;background:var(--line-2)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-3);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcol h5{margin:2px 4px 4px;font:600 12.5px var(--f-body);display:flex;justify-content:space-between;color:var(--ink-2)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left}
.kcard:hover{border-color:var(--ink-3)}
.kcard .ttl{font-size:13px;font-weight:500}
.kcard .meta{display:flex;align-items:center;gap:8px;justify-content:space-between}

/* RM detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);background:none;border:0;padding:0;margin-bottom:12px;font-size:13px}
.back .i{transform:rotate(180deg)}
.rmhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.rmhead .t{flex:1;min-width:260px}
.rmhead h1{font-size:22px;font-weight:700;margin:6px 0 10px;line-height:1.25}
.rmhead .chips{display:flex;gap:6px;flex-wrap:wrap}
.rmhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.rmgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cycles{display:flex;gap:8px;flex-wrap:wrap}
.cyc{flex:1 1 180px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface-2)}
.cyc .n{font:700 13px var(--f-display)}
.cyc .v{font:500 15px var(--f-mono);margin-top:4px}
.cyc.open{border-color:var(--accent);background:var(--accent-soft)}
.cyc.open .n{color:var(--accent-strong)}
.dem{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.dem.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dem .dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dem .dh .tp{font-weight:600}
.dem .dh .sp{flex:1}
.dem .db{padding:14px;display:flex;flex-direction:column;gap:12px}
.dem.done .dh{background:none}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto}
.steps li{flex:1 1 0;min-width:92px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;padding-right:8px}
.steps li::before{content:"";position:absolute;top:10px;left:22px;right:0;height:2px;background:var(--line-2)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--accent)}
.steps .sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;font:600 10.5px var(--f-mono);color:var(--ink-3)}
.steps li.done .sd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.cur .sd{border-color:var(--accent);color:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.wait .sd{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.steps .sl{font-size:12px;color:var(--ink-3);line-height:1.25}
.steps li.cur .sl,.steps li.wait .sl{color:var(--ink);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner b{font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.files{display:flex;gap:6px;flex-wrap:wrap}
.approvals{display:flex;gap:6px;flex-wrap:wrap}

/* feed */
.feed{display:flex;flex-direction:column}
.composer{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.composer textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;background:var(--surface)}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fe{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.fe:last-child{border-bottom:0}
.fe .who{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.fe .who b{font-weight:600}
.fe .when{color:var(--ink-3);font:12px var(--f-mono)}
.fe .txt{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.fe .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fk{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.fk.k-entrega,.fk.k-fase{color:var(--ok)} .fk.k-cancelado{color:var(--bad)} .fk.k-aguardando{color:var(--warn)} .fk.k-solicitacao,.fk.k-correcao{color:var(--s-correcao)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--ink-3)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font:700 30px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.att{display:flex;flex-direction:column}
.att button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.att button:last-child{border-bottom:0}
.att button:hover{background:var(--surface-2)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden;display:flex}
.bar .tr span{height:100%}
.bar .c{font:500 12.5px var(--f-mono);text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* forms */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.c2{grid-column:span 2} .f.c4{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--bad)}
.f input,.f select,.f textarea{height:36px;border:1px solid var(--line-2);border-radius:7px;padding:0 10px;background:var(--surface);min-width:0;width:100%}
.f textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
.f input[type=file]{padding:6px;height:auto}
.f .hint{font-size:12px;color:var(--ink-3)}
.preview{font:500 13px var(--f-mono);padding:10px 12px;border-radius:7px;background:var(--surface-2);border:1px dashed var(--line-2);color:var(--ink);overflow-wrap:anywhere}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;font-weight:500;color:var(--ink);cursor:pointer}
.radios input{width:auto;height:auto}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* modal */
.mback{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(820px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:17px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.merr{color:var(--bad);font-size:13px;font-weight:500}
.mform .form{grid-template-columns:repeat(2,minmax(0,1fr))}

/* notifications */
.npop{position:absolute;right:16px;top:60px;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40}
.npop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font:700 14px var(--f-display);display:flex;justify-content:space-between;align-items:center}
.nitem{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.nitem:hover{background:var(--surface-2)}
.nitem .u{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.nitem.unread .u{background:var(--accent)}
.nitem small{display:block;color:var(--ink-3);font:12px var(--f-mono);margin-top:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.cx{width:9px;height:9px;border-radius:50%;display:inline-block}

.agday li{padding:3px 0}
.agday .tot{display:flex;gap:10px;font:12px var(--f-mono);color:var(--ink-2);padding:0 10px 10px;flex-wrap:wrap}

.crm{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.crm:hover{background:var(--surface-2)}
.crm .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.note{font-size:12.5px;color:var(--ink-3)}

@media (max-width:1180px){

  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:4px}
}
@media (max-width:520px){

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.att .av{align-self:center;height:24px}
@media (max-width:520px){.att button{grid-template-columns:1fr auto}.att button>.pill{grid-column:1/-1;justify-self:start}}

/* ================== detalhe do RM ================== */
function actionsFor(d) {
  const rm = rmOf(d), m = me(), mine = d.assignee === m.id, A = [];

      Object.keys(d.approvals).forEach(s => { if (!d.approvals[s] && isLeader(s)) b('approve', `${ic('check', 'sm')}Dar OK (${SETOR[s].nome})`, 'ok', `data-s="${s}"`); });

    const s = d.stage;
    if (s === 1) { if (d.status === 'aguardando') b('matok', 'Material recebido', 'pri'); else { b('docsok', `${ic('check', 'sm')}Documentos conferidos`, 'pri'); b('waitmat', 'Aguardando material'); } }
    if (s === 2) {
      const ab = abOpen(rm, d.cycle);
      if (d.status === 'aguardando') b('skipab', 'Seguir sem aguardar o As Built');
      else {
        if (d.tipo === 'croqui') b('croquiok', `${ic('pen', 'sm')}Croqui desenhado`, 'pri');
        if (!ab) { b('toab', 'Encaminhar ao As Built e aguardar', d.tipo === 'croqui' ? '' : 'pri', 'data-m="wait"'); b('toab', 'Encaminhar e seguir em paralelo', '', 'data-m="par"'); }

  return A.join('');
}

/* ================== pesquisa ================== */
function rmHay(rm) {
  const ds = demsOf(rm);
  return norm([rm.rm, rm.bairro, rm.cidade, rm.uf, UFS[rm.uf], ENG(rm.eng).nome, U(rm.createdBy).nome, ...ds.map(d => d.num), ...ds.map(d => d.assignee && U(d.assignee).nome), ...rm.cycles.map(c => c.resp && U(c.resp).nome)].join(' '));
}
function rmStatus(rm) {
  if (rm.cancelado) return 'canc';
  const ds = demsOf(rm);
  if (ds.some(overdue)) return 'late';
  return ds.some(d => d.status !== 'concluida') ? 'open' : 'done';
}
function searchRMs(q, f) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  return S.rms.filter(rm => {
    if (f.uf && rm.uf !== f.uf) return false;
    if (f.setor && !demsOf(rm).some(d => d.setor === f.setor)) return false;
    if (f.sit && rmStatus(rm) !== f.sit && !(f.sit === 'open' && rmStatus(rm) === 'late')) return false;
    if (!terms.length) return true;
    const h = rmHay(rm); return terms.every(t => h.includes(t));
  }).sort((a, b) => b.updatedAt - a.updatedAt);
}
function setorChips(rm) {
  const by = {};
  demsOf(rm).forEach(d => { (by[d.setor] = by[d.setor] || []).push(d); });
  return Object.entries(by).map(([s, l]) => { const open = l.filter(d => d.status !== 'concluida'); return `<span class="pill ${open.length ? (open.some(overdue) ? 'bad' : 'warn') : 'ok'}">${SETOR[s].nome}: ${open.length ? esc(stageName(open[0])) : 'concluído'}</span>`; }).join(' ');
}
function renderSearch() {
  const f = UI.f, res = searchRMs(UI.q, f);
  const ufs = [...new Set(S.rms.map(r => r.uf))].sort();
  return `<div class="page"><div class="phead"><h1>${ic('search')}Pesquisa de RMs</h1><span class="sub mono">${res.length} resultado(s)</span></div>
  <div class="filters"><select id="fuf"><option value="">Todos os estados</option>${ufs.map(u => `<option ${f.uf === u ? 'selected' : ''} value="${u}">${UFS[u]}</option>`).join('')}</select>
  <select id="fset"><option value="">Todos os setores</option>${['laudo', 'asbuilt', 'evtl', 'bens', 'correcao'].map(s => `<option ${f.setor === s ? 'selected' : ''} value="${s}">${SETOR[s].nome}</option>`).join('')}</select>
  <select id="fsit"><option value="">Qualquer situação</option>${[['open', 'Em andamento'], ['late', 'Com atraso'], ['done', 'Concluído'], ['canc', 'Cancelado']].map(([v, l]) => `<option ${f.sit === v ? 'selected' : ''} value="${v}">${l}</option>`).join('')}</select>
  <span class="note">Busca por RM, bairro, cidade, estado, engenheiro, responsável ou nº da requisição.</span></div>
  <div class="tablewrap"><table class="list"><thead><tr><th>RM</th><th>Título</th><th>Situação por setor</th><th>Engenheiro</th><th>Vistorias</th><th>Última alteração</th></tr></thead><tbody>
  ${res.slice(0, 80 + UI.more).map(rm => `<tr data-a="open" data-rm="${rm.id}"><td class="num">${esc(rm.rm)}</td><td><div class="ttl">${esc(rmTitle(rm, rm.cycles.length))}</div>${rm.cancelado ? '<span class="pill bad">Cancelado</span>' : ''}</td><td style="max-width:360px"><div style="display:flex;gap:4px;flex-wrap:wrap">${setorChips(rm)}</div></td><td>${esc(ENG(rm.eng).nome)}</td><td class="mono">${rm.cycles.length}</td><td class="dt">${fdt(rm.updatedAt)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhum RM encontrado.</td></tr>'}
  </tbody></table></div>${res.length > 80 + UI.more ? `<p style="text-align:center"><button class="btn" data-a="more">Mostrar mais</button></p>` : ''}</div>`;

const BR = [[-73.9, -4.4], [-70, -4.2], [-69.6, .9], [-67, 2.2], [-64, 4], [-60.8, 5.2], [-59.6, 4.3], [-56.5, 1.9], [-54, 2.3], [-51.6, 4.2], [-50, 1.7], [-48.5, -1.2], [-44.5, -2.5], [-41, -2.9], [-38.5, -3.7], [-35.2, -5.4], [-34.8, -7.5], [-35.7, -9.6], [-37.2, -11.2], [-38.9, -13.3], [-39.2, -17.7], [-40.9, -21.8], [-43.2, -23], [-45.4, -23.8], [-48.5, -26], [-48.7, -28.5], [-50.2, -30.5], [-52.1, -32.4], [-53.4, -33.7], [-55.6, -30.9], [-57.6, -30.2], [-55.8, -28], [-53.8, -27.1], [-54.6, -25.6], [-54.3, -24], [-55.6, -22.6], [-57.9, -22], [-58, -20], [-58.2, -17.4], [-60.2, -16.3], [-60.5, -13.8], [-62.3, -13.1], [-65, -11.9], [-65.4, -9.8], [-68.6, -11], [-70.6, -11], [-72.6, -10], [-73.9, -7.3]];
function km(a, b) { const R = 6371, t = x => x * Math.PI / 180; const dl = t(b[0] - a[0]), dg = t(b[1] - a[1]); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)) * 1.25; }
const CXF = { Baixa: 1, 'Média': 1.4, Alta: 1.9 };
function dayStats(eng, items) {
  let pos = ENG(eng).base, dist = 0, hrs = 0;
  items.forEach(p => { dist += km(pos, [p.lat, p.lng]); pos = [p.lat, p.lng]; hrs += (1 + p.area / 120) * CXF[p.cx]; });

}
function renderRotas() {
  const pool = S.pool.filter(p => !p.cadastrado), ufs = [...new Set(S.pool.map(p => p.uf))].sort();
  const view = pool.filter(p => !UI.rUF || p.uf === UI.rUF), inAg = new Set(S.agenda.map(a => a.poolId));
  let bx = [-74, 6, -34, -34];
  if (UI.rUF && view.length) { const la = view.map(p => p.lat), lo = view.map(p => p.lng); const pd = 1.2; bx = [Math.min(...lo) - pd, Math.max(...la) + pd, Math.max(...lo) + pd, Math.min(...la) - pd]; const w = bx[2] - bx[0], h = bx[1] - bx[3], s = Math.max(w, h); bx = [bx[0] - (s - w) / 2, bx[1] + (s - h) / 2, bx[0] - (s - w) / 2 + s, bx[1] + (s - h) / 2 - s]; }
  const X = lng => (lng - bx[0]) / (bx[2] - bx[0]) * 400, Y = lat => (bx[1] - lat) / (bx[1] - bx[3]) * 400;
  const zoom = 40 / (bx[2] - bx[0]);
  const days = {}; S.agenda.forEach(a => { const k = a.eng + '|' + a.date; (days[k] = days[k] || []).push(a); });
  const lines = Object.entries(days).map(([k, l]) => { const [eng] = k.split('|'); const pts = [ENG(eng).base, ...l.map(a => { const p = S.pool.find(p => p.id === a.poolId); return [p.lat, p.lng]; })]; return `<polyline class="rl" style="stroke:${ENG(eng).cor}" points="${pts.map(p => X(p[1]).toFixed(1) + ',' + Y(p[0]).toFixed(1)).join(' ')}"/>`; }).join('');
  const r = Math.min(9, 4.5 * Math.sqrt(zoom));
  const svg = `<svg class="map" viewBox="0 0 400 400" role="img" aria-label="Mapa dos imóveis disponíveis para visita">
    <polygon class="br" points="${BR.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>
    ${Object.entries(UFC).map(([u, c]) => `<text class="uf" x="${X(c[1])}" y="${Y(c[0])}" text-anchor="middle">${u}</text>`).join('')}
    ${lines}
    ${ENGS.map(e => `<g><rect class="base" x="${X(e.base[1]) - 4}" y="${Y(e.base[0]) - 4}" width="8" height="8" style="fill:${e.cor}"/></g>`).join('')}
    ${view.map(p => `<circle class="pt ${UI.sel.has(p.id) ? 'sel' : ''}" data-a="rsel" data-id="${p.id}" cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="${r}" style="fill:${inAg.has(p.id) ? 'var(--ink-3)' : p.cx === 'Alta' ? 'var(--bad)' : p.cx === 'Média' ? 'var(--warn)' : 'var(--ok)'}"><title>RM ${p.rm} · ${p.bairro} · ${p.cidade}/${p.uf} · ${p.area} m² · ${p.cx}</title></circle>`).join('')}
  </svg>`;
  const canAct = me().setor === 'adm';
  return `<div class="page"><div class="phead"><div><span class="eyebrow">ADM / Logística</span><h1>Rotas e agenda dos engenheiros</h1></div><span class="sp"></span><span class="note">${pool.length} imóveis disponíveis · ${S.agenda.length} na agenda</span></div>
  ${canAct ? '' : `<div class="banner info" style="margin-bottom:12px">${ic('user')}<div>Somente ADM / Logística monta a agenda. Você está vendo em modo leitura.</div></div>`}
  <div class="filters"><div class="ufchips"><button class="${!UI.rUF ? 'on' : ''}" data-a="ruf" data-uf="">Brasil</button>${ufs.map(u => `<button class="${UI.rUF === u ? 'on' : ''}" data-a="ruf" data-uf="${u}">${u}</button>`).join('')}</div>
  <span class="legend" style="margin:0"><span><span class="cx Baixa"></span>Baixa</span><span><span class="cx Média"></span>Média</span><span><span class="cx Alta"></span>Alta complexidade</span><span><i style="background:var(--ink-3);border-radius:50%"></i>Na agenda</span></span></div>
  <div class="rgrid">

    <section class="panel"><h3>${ic('map')}Mapa</h3>${svg}<p class="note" style="margin:8px 0 0">Clique nos pontos para selecionar. Quadrados = base de cada engenheiro; linhas = rota do dia.</p></section>

      <div class="f"><label for="rdate">Dia</label><input type="date" id="rdate" value="${UI.rDate || new Date(Date.now() + D).toISOString().slice(0, 10)}"></div></div>
      <button class="btn pri" data-a="radd" ${!canAct || !UI.sel.size ? 'disabled' : ''} style="width:100%;justify-content:center;margin-bottom:14px">${ic('plus', 'sm')}Adicionar ${UI.sel.size} selecionado(s)</button>
      ${Object.keys(days).length ? Object.entries(days).sort().map(([k, l]) => { const [eng, date] = k.split('|'); const ps = l.map(a => S.pool.find(p => p.id === a.poolId)); const st = dayStats(eng, ps); return `<div class="agday"><header><b>${ENG(eng).nome} · ${fd(new Date(date + 'T12:00'))}</b>${canAct ? `<button class="btn sm pri" data-a="rcad" data-k="${k}">Cadastrar RMs</button>` : ''}</header><ol>${ps.map((p, i) => `<li>RM ${p.rm} · ${esc(p.bairro)}, ${esc(p.cidade)}/${p.uf} <span class="muted">${p.area} m² · ${p.cx}</span>${canAct ? ` <button class="btn sm ghost" data-a="rdel" data-id="${l[i].id}" aria-label="Remover">${ic('x', 'sm')}</button>` : ''}</li>`).join('')}</ol><div class="tot"><span>${ps.length} imóveis</span><span>~${st.dist} km</span><span>~${st.hrs.toFixed(1)} h</span>${st.hrs > 9 ? '<span class="pill bad">dia pesado</span>' : ''}</div></div>`; }).join('') : '<p class="note">Selecione imóveis, escolha engenheiro e dia. A estimativa considera área, complexidade e deslocamento a partir da base.</p>'}
    </section></div></div>`;

const CLIENT_KINDS = ['cadastro', 'entrega', 'fase', 'asbuilt', 'evtl', 'bens', 'solicitacao', 'correcao', 'cancelado', 'reagendado', 'regularizacao'];
function clientStatus(rm) {

  if (L) out.push(L.status === 'concluida' ? ['ok', 'Laudo concluído'] : L.stage === 6 ? ['ok', 'Laudo entregue'] : ['info', `Laudo: ${L.status === 'entrada' ? 'recebido' : flowOf(L)[L.stage]}`]);

  ds.filter(d => d.setor === 'evtl').slice(-1).forEach(d => out.push(d.status === 'concluida' ? ['ok', 'EVTL finalizado'] : ['info', 'EVTL em andamento']));
  ds.filter(d => d.setor === 'bens').forEach(d => out.push(d.status === 'concluida' ? ['ok', 'Bens e Imóveis finalizado'] : ['info', `Bens: etapa ${d.stage + 1} de 4`]));

}

      title: 'Nova solicitação', intro: rm ? `RM ${esc(rm.rm)} · ${esc(rm.bairro)} · ${esc(rm.cidade)}/${rm.uf}` : 'Pesquise o RM pelo número.',
      body: (rm ? '' : fIn('rm', 'Nº do RM', true, 'inputmode="numeric" list="rmlist" placeholder="ex.: 2210"', 'c4') + `<datalist id="rmlist">${S.rms.filter(r => r.origem !== 'bens').map(r => `<option value="${r.rm}">${esc(r.bairro + ' · ' + r.cidade + '/' + r.uf)}</option>`).join('')}</datalist>`) +
        `<div class="f c4"><label>Motivo <span class="req">*</span></label><div class="radios">${ops.map(([k, l], i) => `<label><input type="radio" name="motivo" value="${k}" ${i ? '' : 'checked'}> ${l}</label>`).join('')}</div></div>` + fTA('desc', 'Descrição da solicitação', true) + fFile(),
      ok: 'Abrir solicitação',
      onOk(v, f) {
        const r = rm || findRM(v.rm); if (!r) return 'RM não encontrado. Confira o número.';
        if (!v.desc.trim()) return 'Descreva a solicitação.';
        const so = { id: uid(), rmId: r.id, motivo: v.motivo, desc: v.desc.trim(), anexos: filesOf(f.querySelector('#m-files')), by: S.me, at: Date.now() };
        S.sols.push(so);
        if (v.motivo.startsWith('correcao')) {
          const ap = { adm: false }; demsOf(r).forEach(d => { if (d.setor !== 'correcao') ap[d.setor] = false; });
          newDem(r, { setor: 'correcao', tipo: v.motivo === 'correcao_rm' ? 'rm' : 'outras', status: 'aguardando', waitKind: 'oks', approvals: ap, solId: so.id });
          Object.keys(ap).forEach(s => notifySetorLeader(s, `Correção no RM ${r.rm} precisa do OK de ${SETOR[s].nome}.`, r.id));
        } else { newDem(r, { tipo: v.motivo, solId: so.id }); notifySetorLeader('laudo', `Nova solicitação de ${MOTIVOS[v.motivo]} no RM ${r.rm}.`, r.id); }
        addFeed(r, 'solicitacao', `Solicitação de ${MOTIVOS[v.motivo]}: ${so.desc}`, { anexos: so.anexos });
        toast('Solicitação aberta.');
      }
    });
  },
  comment(ds) {
    const rm = S.rms.find(r => r.id === ds.rm), t = $('#fc').value.trim(), an = filesOf($('#ff'));
    if (!t && !an.length) { toast('Escreva algo para registrar no histórico.'); return; }
    addFeed(rm, 'comentario', t || 'Anexo adicionado.', { anexos: an }); demsOf(rm).forEach(d => d.status !== 'concluida' && touch(d)); commit(); toast('Registrado no histórico.');
  },

  rsel(ds, el, e) { if (S.agenda.some(a => a.poolId === ds.id)) return; UI.sel.has(ds.id) ? UI.sel.delete(ds.id) : UI.sel.add(ds.id); render(); },
  ruf(ds) { UI.rUF = ds.uf; render(); },
  radd() { const eng = $('#reng').value, date = $('#rdate').value; if (!date) { toast('Escolha o dia.'); return; } UI.rEng = eng; UI.rDate = date; UI.sel.forEach(id => S.agenda.push({ id: uid(), eng, date, poolId: id })); toast(`${UI.sel.size} imóvel(is) na agenda de ${ENG(eng).nome}.`); UI.sel.clear(); commit(); },
  rdel(ds) { S.agenda = S.agenda.filter(a => a.id !== ds.id); commit(); },
  rcad(ds) {
    const [eng, date] = ds.k.split('|'), items = S.agenda.filter(a => a.eng === eng && a.date === date);
    let ok = 0, dup = 0;
    items.forEach(a => {
      const p = S.pool.find(p => p.id === a.poolId);
      if (findRM(p.rm)) { dup++; const ex = findRM(p.rm); addFeed(ex, 'comentario', `Imóvel apareceu de novo na agenda de ${ENG(eng).nome} em ${fd(new Date(date + 'T12:00'))}. Cadastro não duplicado.`); }
      else { createRM({ rm: p.rm, bairro: p.bairro, cidade: p.cidade, uf: p.uf, lat: p.lat, lng: p.lng, eng, vistoria: p.vistoria, confirmado: p.confirmado, dataVistoria: new Date(date + 'T12:00').getTime(), desenho: p.vistoria > 1 ? 'croqui' : 'asbuilt', notas: `Área ~${p.area} m² · complexidade ${p.cx}.` }); ok++; }
      p.cadastrado = true;
    });
    S.agenda = S.agenda.filter(a => !items.includes(a));
    commit(); toast(`${ok} RM(s) cadastrado(s) na caixa de entrada${dup ? `, ${dup} já existia(m)` : ''}.`);
  },
  evassign() {
    const who = $('#evwho').value, mes = $('#evmes').value, ids = [...document.querySelectorAll('.evc:checked')].map(c => c.value);
    if (!ids.length) { toast('Selecione ao menos um RM.'); return; }
    ids.forEach(id => {
      const rm = S.rms.find(r => r.id === id), ab = S.dem.filter(d => d.rmId === id && d.setor === 'asbuilt').sort((a, b) => b.cycle - a.cycle)[0], done = ab.status === 'concluida';
      newDem(rm, { setor: 'evtl', tipo: 'evtl', cycle: ab.cycle, assignee: who, mes, stage: done ? 2 : 1, status: done ? 'andamento' : 'aguardando', waitKind: done ? null : 'desenho' });
      if (!done) { ab.priority = true; touch(ab); notifySetorLeader('asbuilt', `EVTL marcou o As Built do RM ${rm.rm} como prioridade.`, rm.id); if (ab.assignee) notify(ab.assignee, `Prioridade EVTL: As Built do RM ${rm.rm}.`, rm.id); }
      addFeed(rm, 'encaminhado', `EVTL de ${mes} atribuído a ${U(who).nome}.${done ? '' : ' Desenho As Built marcado como prioridade.'}`);
      if (who !== S.me) notify(who, `EVTL do RM ${rm.rm} atribuído a você.`, rm.id);
    });
    commit(); toast(`${ids.length} EVTL(s) atribuído(s) a ${U(who).nome}.`);
  },
};

function submitCad(form) {
  const v = Object.fromEntries(new FormData(form));
  const err = m => { toast(m); };
  const no = String(v.rm || '').replace(/\D/g, '');
  if (!no) return err('Informe o número do RM.');
  if (!v.bairro.trim() || !v.cidade.trim()) return err('Bairro e cidade são obrigatórios.');
  if (findRM(no)) { cadUpdate(); return err(`RM ${no} já cadastrado. Use o cadastro existente.`); }
  const rm = createRM({ rm: no, bairro: v.bairro.trim(), cidade: v.cidade.trim(), uf: v.uf, eng: v.eng, vistoria: +v.vistoria, desenho: v.desenho, classif: v.classif, regiao: v.regiao.trim(), confirmado: v.conf === '1', notas: v.notas.trim(), anexos: filesOf($('#c-files')), assignee: v.assignee || null, bens: !!v.bens, dataVistoria: v.dv ? new Date(v.dv + 'T12:00').getTime() : Date.now() });
  UI.hist = [{ name: 'dash' }]; UI.view = { name: 'rm', id: rm.id };
  commit(); toast(`RM ${no} cadastrado${v.assignee ? ` e atribuído a ${U(v.assignee).nome}` : ' na caixa de entrada'}.`);
}

/* ================== eventos ================== */
function render() {
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  $('#app').innerHTML = me().setor === 'cliente' ? renderClient() : renderInternal();
  if (id && id !== 'app') { const el = document.getElementById(id); if (el && el !== document.body) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) { } } }
  if (UI.view.name === 'cad') cadUpdate();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (UI.notif && !e.target.closest('.npop') && !(el && el.dataset.a === 'bell')) { UI.notif = false; if (!el) { render(); return; } }
  if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a !== 'mbg' && el.tagName !== 'INPUT') e.preventDefault();
  if (el.tagName === 'INPUT') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cadform') return submitCad(e.target);
  if (e.target.id === 'mform' && M) {
    const v = Object.fromEntries(new FormData(e.target));
    Object.keys(v).forEach(k => { if (typeof v[k] === 'string') v[k] = v[k]; });
    const r = M.onOk(v, e.target);
    if (typeof r === 'string') { $('#merr').textContent = r; return; }
    closeModal(); commit();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'who') { S.me = t.value; UI.hist = []; UI.view = me().setor === 'cliente' ? { name: 'rms' } : { name: 'dash' }; UI.q = ''; UI.notif = false; UI.more = 0; UI.ctab = 'rms'; commit(); toast(`Você está como ${me().nome}.`); }
  else if (t.id === 'showBens') { UI.showBens = t.checked; render(); }
  else if (t.id === 'fuf' || t.id === 'fset' || t.id === 'fsit') { UI.f = { uf: $('#fuf').value, setor: $('#fset').value, sit: $('#fsit').value }; render(); }
  else if (t.id === 'reng') UI.rEng = t.value;
  else if (t.id === 'rdate') UI.rDate = t.value;
  else if (t.id === 'evmes') UI.evMes = t.value;
  else if (t.closest && t.closest('#cadform')) cadUpdate();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gq') {
    UI.q = t.value; UI.more = 0;
    if (me().setor === 'cliente') { UI.view = { name: 'rms' }; UI.ctab = 'rms'; }
    else if (UI.view.name !== 'search' && t.value) { (UI.hist = UI.hist || []).push(UI.view); UI.view = { name: 'search' }; }
    render();
  } else if (t.closest && t.closest('#cadform')) cadUpdate();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (M) closeModal(); else if (UI.notif) { UI.notif = false; render(); } }
  if (e.key === 'Enter' && e.target.id === 'gq' && me().setor !== 'cliente') { UI.view = { name: 'search' }; render(); }
});

load();
render();
</script></body></html>
