<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Esteira Torre Forte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — topbar, dark side rail with inbox tree, scrolling work area. Steel-blue ink + signal orange from obra/engenharia. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7f9; --surface-3:#e7ebf0;
  --ink:#17202a; --ink-2:#47525f; --ink-3:#7a8592; --line:#d8dee5; --line-2:#c5cdd6;
  --nav:#162230; --nav-2:#1e2d3d; --nav-ink:#b9c5d1; --nav-ink-2:#7f8fa0; --nav-hi:#ffffff;
  --accent:#d4691e; --accent-ink:#ffffff; --accent-soft:#fbe9dc; --accent-strong:#a94f10;
  --link:#225d9c;
  --ok:#2d7a4f; --ok-bg:#e0f1e7; --warn:#9a6a0b; --warn-bg:#fbf0d4; --bad:#b8322f; --bad-bg:#f9e1e0; --info:#2862a3; --info-bg:#e1ecf8;
  --s-laudo:#2862a3; --s-asbuilt:#7046b0; --s-evtl:#13807a; --s-bens:#5c7a1c; --s-correcao:#b8322f; --s-adm:#b5651d;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.06);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --e1:#2a78d6; --e2:#eb6834; --e3:#1baf7a;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2632; --surface-3:#22303e;
  --ink:#e5eaf0; --ink-2:#a8b3bf; --ink-3:#7a8794; --line:#283543; --line-2:#344454;
  --nav:#0a1016; --nav-2:#141e29; --nav-ink:#a9b6c3; --nav-ink-2:#6b7b8c; --nav-hi:#ffffff;
  --accent:#e8843f; --accent-ink:#1a0f06; --accent-soft:#3a2516; --accent-strong:#f2a066;
  --link:#7fb2ea;
  --ok:#6cc895; --ok-bg:#16301f; --warn:#e3b54a; --warn-bg:#33290f; --bad:#f07b77; --bad-bg:#3a1a1a; --info:#7fb2ea; --info-bg:#162a40;
  --s-laudo:#7fb2ea; --s-asbuilt:#b294ea; --s-evtl:#5cc9c0; --s-bens:#a5c45b; --s-correcao:#f07b77; --s-adm:#e8a15a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --e1:#3987e5; --e2:#d95926; --e3:#199e70;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#161f29; --surface-2:#1b2632; --surface-3:#22303e;
  --ink:#e5eaf0; --ink-2:#a8b3bf; --ink-3:#7a8794; --line:#283543; --line-2:#344454;
  --nav:#0a1016; --nav-2:#141e29; --nav-ink:#a9b6c3; --nav-ink-2:#6b7b8c; --nav-hi:#ffffff;
  --accent:#e8843f; --accent-ink:#1a0f06; --accent-soft:#3a2516; --accent-strong:#f2a066;
  --link:#7fb2ea;
  --ok:#6cc895; --ok-bg:#16301f; --warn:#e3b54a; --warn-bg:#33290f; --bad:#f07b77; --bad-bg:#3a1a1a; --info:#7fb2ea; --info-bg:#162a40;
  --s-laudo:#7fb2ea; --s-asbuilt:#b294ea; --s-evtl:#5cc9c0; --s-bens:#a5c45b; --s-correcao:#f07b77; --s-adm:#e8a15a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --e1:#3987e5; --e2:#d95926; --e3:#199e70;
  color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}
.muted{color:var(--ink-3)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ---------- shell ---------- */
#app{height:100%}
.app{height:100%;display:grid;grid-template-columns:272px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"top top" "nav main"}
.app.client{grid-template-columns:1fr;grid-template-areas:"top" "main"}
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--nav);color:var(--nav-ink);border-bottom:1px solid var(--nav-2);min-width:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--nav-hi);white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark .i{width:20px;height:20px;stroke-width:2}
.brand b{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.brand span{font-size:12px;color:var(--nav-ink-2);border-left:1px solid var(--nav-2);padding-left:10px;letter-spacing:.04em}
.gsearch{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--nav-2);border:1px solid transparent;border-radius:7px;padding:0 10px;height:36px;min-width:0}
.gsearch:focus-within{border-color:var(--accent)}
.gsearch input{flex:1;background:none;border:0;outline:0;color:var(--nav-hi);min-width:0}
.gsearch input::placeholder{color:var(--nav-ink-2)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:7px;background:none;border:0;color:var(--nav-ink)}
.iconbtn:hover{background:var(--nav-2);color:var(--nav-hi)}
.badge{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:600 10px/17px var(--f-body);text-align:center}
.who{display:flex;align-items:center;gap:8px}
.who select{background:var(--nav-2);border:1px solid var(--nav-2);color:var(--nav-hi);border-radius:7px;height:36px;padding:0 8px;max-width:210px}
.who label{font-size:11px;color:var(--nav-ink-2);text-transform:uppercase;letter-spacing:.06em}
.hamb{display:none}

/* ---------- side nav ---------- */
.nav{grid-area:nav;background:var(--nav);color:var(--nav-ink);overflow-y:auto;padding:14px 10px 20px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--nav-2)}
.nav .cta{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;margin-bottom:10px}
.nav .cta:hover{filter:brightness(1.07)}
.nav h4{margin:16px 8px 6px;font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--nav-ink-2);display:flex;justify-content:space-between}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:6px;border:0;background:none;color:var(--nav-ink);text-align:left}
.ni:hover{background:var(--nav-2);color:var(--nav-hi)}
.ni.on{background:var(--nav-2);color:var(--nav-hi);box-shadow:inset 3px 0 0 var(--accent)}
.ni .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--nav-ink-2);font-variant-numeric:tabular-nums}
.ni.on .n{color:var(--nav-hi)}
.ni .n.hot{color:var(--accent)}
.ni .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree{display:flex;flex-direction:column;gap:1px}
.tnode{display:flex;align-items:center}
.tnode .tog{width:22px;height:28px;display:grid;place-items:center;background:none;border:0;color:var(--nav-ink-2);flex:none}
.tnode .tog .i{width:13px;height:13px;transition:transform .15s}
.tnode .tog.open .i{transform:rotate(90deg)}
.tnode .tog.none{visibility:hidden}
.tnode .ni{padding:5px 8px 5px 4px;font-size:13px}
.tkids{padding-left:22px;display:flex;flex-direction:column}
.tkids .ni{font-size:12.5px;padding:4px 8px;color:var(--nav-ink-2)}
.tkids .ni:hover,.tkids .ni.on{color:var(--nav-hi)}
.navfoot{margin-top:auto;padding:16px 8px 0;font-size:12px;color:var(--nav-ink-2);display:flex;flex-direction:column;gap:8px}
.navfoot button{background:none;border:1px solid var(--nav-2);color:var(--nav-ink);border-radius:6px;padding:6px 8px;text-align:left}
.navfoot button:hover{border-color:var(--nav-ink-2)}
.dot-l{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ---------- main ---------- */
.main{grid-area:main;overflow-y:auto;min-width:0}
.page{padding-block:22px 48px;padding-inline:24px;max-width:1480px;margin:0 auto}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.phead .sub{color:var(--ink-3);font-size:13px}
.phead .sp{flex:1}
.eyebrow{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:32px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.seg button.on{background:var(--surface-3);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.tag-new{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--info);color:var(--surface);letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);white-space:nowrap}
.setor{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sc,var(--ink-2));white-space:nowrap}
.s-laudo{--sc:var(--s-laudo)} .s-asbuilt{--sc:var(--s-asbuilt)} .s-evtl{--sc:var(--s-evtl)} .s-bens{--sc:var(--s-bens)} .s-correcao{--sc:var(--s-correcao)} .s-adm{--sc:var(--s-adm)} .s-cliente{--sc:var(--ink-2)}

.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:hsl(var(--h) 42% 46%);color:#fff;font:600 11.5px/1 var(--f-body);letter-spacing:.02em;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.off{opacity:.5;filter:grayscale(1)}
.av.av-none{background:none;border:1px dashed var(--line-2);color:var(--ink-3)}

/* list table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.list{width:100%;border-collapse:collapse;min-width:980px}
.list th{position:sticky;top:0;background:var(--surface-2);text-align:left;font:600 12px var(--f-body);color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--surface-2)}
.list .num{font:500 13px var(--f-mono);color:var(--ink-3)}
.list .ttl{font-weight:500;color:var(--ink);margin:3px 0 6px;line-height:1.35}
.list .dt{font:12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.rowtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rowcancel td{opacity:.6}

/* progress dots (like the original but readable) */
.dots{display:flex;align-items:center;gap:3px}
.dots i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);background:var(--surface)}
.dots i.done{background:var(--accent);border-color:var(--accent)}
.dots i.done::after{content:"";width:6px;height:3.5px;border-left:1.6px solid var(--accent-ink);border-bottom:1.6px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.dots i.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dots i.cur::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.wait{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
.dots i.wait::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.dots b{width:6px;height:1.5px;background:var(--line-2)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-3);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcol h5{margin:2px 4px 4px;font:600 12.5px var(--f-body);display:flex;justify-content:space-between;color:var(--ink-2)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left}
.kcard:hover{border-color:var(--ink-3)}
.kcard .ttl{font-size:13px;font-weight:500}
.kcard .meta{display:flex;align-items:center;gap:8px;justify-content:space-between}

/* RM detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);background:none;border:0;padding:0;margin-bottom:12px;font-size:13px}
.back .i{transform:rotate(180deg)}
.rmhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.rmhead .t{flex:1;min-width:260px}
.rmhead h1{font-size:22px;font-weight:700;margin:6px 0 10px;line-height:1.25}
.rmhead .chips{display:flex;gap:6px;flex-wrap:wrap}
.rmhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.rmgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cycles{display:flex;gap:8px;flex-wrap:wrap}
.cyc{flex:1 1 180px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface-2)}
.cyc .n{font:700 13px var(--f-display)}
.cyc .v{font:500 15px var(--f-mono);margin-top:4px}
.cyc.open{border-color:var(--accent);background:var(--accent-soft)}
.cyc.open .n{color:var(--accent-strong)}
.dem{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.dem.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dem .dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.dem .dh .tp{font-weight:600}
.dem .dh .sp{flex:1}
.dem .db{padding:14px;display:flex;flex-direction:column;gap:12px}
.dem.done .dh{background:none}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:0;overflow-x:auto}
.steps li{flex:1 1 0;min-width:92px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;padding-right:8px}
.steps li::before{content:"";position:absolute;top:10px;left:22px;right:0;height:2px;background:var(--line-2)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--accent)}
.steps .sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;position:relative;z-index:1;font:600 10.5px var(--f-mono);color:var(--ink-3)}
.steps li.done .sd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.cur .sd{border-color:var(--accent);color:var(--accent-strong);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.wait .sd{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.steps .sl{font-size:12px;color:var(--ink-3);line-height:1.25}
.steps li.cur .sl,.steps li.wait .sl{color:var(--ink);font-weight:600}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:7px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner b{font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.files{display:flex;gap:6px;flex-wrap:wrap}
.approvals{display:flex;gap:6px;flex-wrap:wrap}

/* feed */
.feed{display:flex;flex-direction:column}
.composer{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.composer textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;background:var(--surface)}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fe{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.fe:last-child{border-bottom:0}
.fe .who{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.fe .who b{font-weight:600}
.fe .when{color:var(--ink-3);font:12px var(--f-mono)}
.fe .txt{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.fe .ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fk{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.fk.k-entrega,.fk.k-fase{color:var(--ok)} .fk.k-cancelado{color:var(--bad)} .fk.k-aguardando{color:var(--warn)} .fk.k-solicitacao,.fk.k-correcao{color:var(--s-correcao)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--ink-3)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font:700 30px/1.1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}

function renderKanban(items) {

/* ================== detalhe do RM ================== */
function actionsFor(d) {
  const rm = rmOf(d), m = me(), mine = d.assignee === m.id, A = [];
  const b = (a, l, k = '', x = '') => A.push(`<button class="btn sm ${k}" data-a="${a}" data-id="${d.id}" ${x}>${l}</button>`);
  if (rm.cancelado || d.status === 'concluida') return '';
  if (d.setor === 'correcao') {
    if (d.stage === 0) {
      Object.keys(d.approvals).forEach(s => { if (!d.approvals[s] && isLeader(s)) b('approve', `${ic('check', 'sm')}Dar OK (${SETOR[s].nome})`, 'ok', `data-s="${s}"`); });
      if (Object.values(d.approvals).every(Boolean) && m.lider) b('forward', 'Encaminhar correção', 'pri');
    } else if (mine) { if (d.tipo === 'rm') b('editrm', `${ic('edit', 'sm')}Editar dados do RM`); b('corrdone', 'Concluir correção', 'pri'); }
    else if (canAssign(d)) b('assign', 'Reatribuir');
    return A.join('');
  }
  if (d.setor === 'bens') {
    if (mine || isLeader('bens')) { b('bensnext', d.stage === 3 ? 'Concluir proposta' : `Concluir etapa ${d.stage + 1}`, 'pri'); b('evolup', 'Atualizar evolução da obra'); }
    return A.join('');
  }
  if (d.status === 'entrada') {
    if (isMember(d.setor) && !m.inativo) b('assume', 'Assumir', 'pri');
    if (canAssign(d)) b('assign', 'Atribuir');
    return A.join('');
  }
  if (!mine) { if (canAssign(d)) b('assign', 'Reatribuir'); return A.join(''); }
  if (isMain(d)) {
    if (rm.legacyTarget > d.cycle) { b('legacy', `Regularizar até a ${rm.legacyTarget}ª vistoria`, 'pri'); return A.join(''); }
    const s = d.stage;
    if (s === 1) { if (d.status === 'aguardando') b('matok', 'Documentação recebida', 'pri'); else { b('docsok', `${ic('check', 'sm')}Documentos conferidos`, 'pri'); b('waitmat', 'Documentação incompleta'); } }
    if (s === 2) {
      const ab = abOpen(rm, d.cycle);
      if (d.status === 'aguardando') b('skipab', 'Seguir sem aguardar o As Built');
      else {
        if (d.tipo === 'croqui') b('croquiok', `${ic('pen', 'sm')}Croqui desenhado`, 'pri');
        if (!ab) { b('toab', 'Encaminhar ao As Built e aguardar', d.tipo === 'croqui' ? '' : 'pri', 'data-m="wait"'); b('toab', 'Encaminhar e seguir em paralelo', '', 'data-m="par"'); }
        else b('skipab', 'Seguir (As Built em andamento)', 'pri');
      }
    }
    if (s === 3) b('step', 'Concluir avaliação imobiliária', 'pri');
    if (s === 4) b('step', 'Concluir laudo de vistoria', 'pri');
    if (s === 5) b('send', 'Enviar para o cliente', 'pri');
    if (s === 6 && d.status === 'andamento') b('review', 'Concluir revisão e finalizar', 'pri');
  } else if (d.setor === 'laudo') {
    if (d.stage < 3) b('step', `Concluir ${FLOW.sol[d.stage].toLowerCase()}`, 'pri'); else b('send', 'Enviar para o cliente', 'pri');
  } else if (d.setor === 'asbuilt') { if (d.status === 'aguardando' && d.waitKind === 'material') b('matok', 'Documentação recebida', 'pri'); else { b('abdone', `${ic('check', 'sm')}Concluir desenho As Built`, 'pri'); b('waitmat', 'Documentação incompleta'); } }
  else if (d.setor === 'evtl' && d.stage === 2) b('evtldone', 'Concluir EVTL', 'pri');
  b('release', 'Devolver à caixa', 'ghost');
  if (canAssign(d)) b('assign', 'Reatribuir', 'ghost');
  return A.join('');
}
function bannerFor(d) {
  const rm = rmOf(d);
  if (rm.cancelado) return '';
  if (d.status === 'aguardando' && d.waitKind === 'material') return `<div class="banner ${overdue(d) ? 'bad' : 'warn'}">${ic('clock')}<div><b>${overdue(d) ? 'Documentação atrasada' : 'Ocorrência aberta: documentação incompleta'}</b> · ${left(d.waitUntil)} (${fdt(d.waitUntil)})<br>${esc(d.waitReason || '')}</div></div>`;
  if (d.status === 'aguardando' && d.waitKind === 'asbuilt') { const ab = abOpen(rm, d.cycle); return `<div class="banner warn">${ic('pen')}<div><b>${d.stage === 6 ? 'Laudo já entregue ao cliente.' : 'Aguardando desenho As Built.'}</b> ${ab ? (ab.assignee ? `Com ${esc(U(ab.assignee).nome)}.` : 'Na caixa de entrada do As Built.') : ''} Quando o As Built concluir, volta para ${d.stage === 6 ? 'revisão de quem enviou' : 'esta esteira'}.</div></div>`; }

  if (isMain(d) && d.asbuiltPending && d.status !== 'concluida' && abOpen(rm, d.cycle)) return `<div class="banner info">${ic('pen')}<div>As Built em paralelo: ${abOpen(rm, d.cycle).assignee ? 'com ' + esc(U(abOpen(rm, d.cycle).assignee).nome) : 'na caixa de entrada do As Built'}.</div></div>`;
  if (rm.legacyTarget > d.cycle && isMain(d)) return `<div class="banner info">${ic('flag')}<div><b>RM chegou na ${rm.legacyTarget}ª vistoria antes do sistema.</b> Quem assumir informa valor e responsável das vistorias anteriores para registrar o histórico.</div></div>`;

  return '';
}

function rmHay(rm) {
  const ds = demsOf(rm);
  return norm([rm.rm, rm.bairro, rm.cidade, rm.uf, UFS[rm.uf], ENG(rm.eng).nome, U(rm.createdBy).nome, ...ds.map(d => d.num), ...ds.map(d => d.assignee && U(d.assignee).nome), ...rm.cycles.map(c => c.resp && U(c.resp).nome)].join(' '));
}
function rmStatus(rm) {
  if (rm.cancelado) return 'canc';
  const ds = demsOf(rm);
  if (ds.some(overdue)) return 'late';
  return ds.some(d => d.status !== 'concluida') ? 'open' : 'done';
}
function searchRMs(q, f) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  return S.rms.filter(rm => {
    if (f.uf && rm.uf !== f.uf) return false;
    if (f.setor && !demsOf(rm).some(d => d.setor === f.setor)) return false;
    if (f.sit && rmStatus(rm) !== f.sit && !(f.sit === 'open' && rmStatus(rm) === 'late')) return false;
    if (!terms.length) return true;
    const h = rmHay(rm); return terms.every(t => h.includes(t));
  }).sort((a, b) => b.updatedAt - a.updatedAt);
}
function setorChips(rm) {
  const by = {};

}

const BR = [[-73.9, -4.4], [-70, -4.2], [-69.6, .9], [-67, 2.2], [-64, 4], [-60.8, 5.2], [-59.6, 4.3], [-56.5, 1.9], [-54, 2.3], [-51.6, 4.2], [-50, 1.7], [-48.5, -1.2], [-44.5, -2.5], [-41, -2.9], [-38.5, -3.7], [-35.2, -5.4], [-34.8, -7.5], [-35.7, -9.6], [-37.2, -11.2], [-38.9, -13.3], [-39.2, -17.7], [-40.9, -21.8], [-43.2, -23], [-45.4, -23.8], [-48.5, -26], [-48.7, -28.5], [-50.2, -30.5], [-52.1, -32.4], [-53.4, -33.7], [-55.6, -30.9], [-57.6, -30.2], [-55.8, -28], [-53.8, -27.1], [-54.6, -25.6], [-54.3, -24], [-55.6, -22.6], [-57.9, -22], [-58, -20], [-58.2, -17.4], [-60.2, -16.3], [-60.5, -13.8], [-62.3, -13.1], [-65, -11.9], [-65.4, -9.8], [-68.6, -11], [-70.6, -11], [-72.6, -10], [-73.9, -7.3]];
function km(a, b) { const R = 6371, t = x => x * Math.PI / 180; const dl = t(b[0] - a[0]), dg = t(b[1] - a[1]); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)) * 1.25; }
const CXF = { Baixa: 1, 'Média': 1.4, Alta: 1.9 };
function dayStats(eng, items) {
  let pos = ENG(eng).base, dist = 0, hrs = 0;
  items.forEach(p => { dist += km(pos, [p.lat, p.lng]); pos = [p.lat, p.lng]; hrs += (1 + p.area / 120) * CXF[p.cx]; });
  return { dist: Math.round(dist), hrs: hrs + dist / 70 };
}
function renderRotas() {
  const pool = S.pool.filter(p => !p.cadastrado), ufs = [...new Set(S.pool.map(p => p.uf))].sort();

const fSel = (n, l, opts, v, cls = 'c2') => `<div class="f ${cls}"><label for="m-${n}">${l}</label><select id="m-${n}" name="${n}">${opts.map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
const fFile = () => `<div class="f c4"><label for="m-files">Anexos</label><input id="m-files" type="file" multiple></div>`;
const filesOf = el => [...((el && el.files) || [])].map(f => ({ nome: f.name, tam: f.size }));
const laudoUsers = () => USERS.filter(u => u.setor === 'laudo').map(u => [u.id, u.nome]);
function closeFields(d) {
  return fIn('valor', 'Valor do imóvel na avaliação imobiliária', true, 'inputmode="decimal" placeholder="ex.: 350.000,00"') +
    fSel('resp', 'Responsável por fechar o laudo', laudoUsers(), me().setor === 'laudo' ? S.me : d.assignee) +
    fTA('desc', 'Descrição', true, 'Resumo do que foi entregue / observações para o histórico');
}
function readClose(v) {
  const valor = parseBRL(v.valor);
  if (!(valor > 0)) return 'Informe o valor do imóvel (ex.: 350.000,00).';
  if (!String(v.desc || '').trim()) return 'A descrição é obrigatória.';
  return { valor, resp: v.resp, desc: v.desc.trim() };
}
const dem = id => S.dem.find(d => d.id === id);
function commit() { save(); const sc = $('#main')?.scrollTop; render(); const m = $('#main'); if (m && sc) m.scrollTop = sc; }

/* ================== regras de fluxo ================== */
function finishMain(d, c) {
  const rm = rmOf(d);
  d.status = 'concluida'; d.doneAt = Date.now(); d.assignee = d.assignee || S.me; touch(d);
  const cy = rm.cycles.find(x => x.n === d.cycle);
  Object.assign(cy, { status: 'concluida', valor: c.valor, resp: c.resp, desc: c.desc, at: Date.now() });
  addFeed(rm, 'fase', `${d.cycle}ª vistoria finalizada. ${c.desc}`, { valor: c.valor, resp: c.resp });
  notifyDone(d, `${d.cycle}ª vistoria (laudo completo)`);
  notify('cliente', `RM ${rm.rm}: ${d.cycle}ª vistoria completa, todas as etapas de laudo finalizadas.`, rm.id);
}
function asbuiltDone(ab) {
  const rm = rmOf(ab);
  const L = S.dem.find(x => isMain(x) && x.rmId === rm.id && x.cycle === ab.cycle && x.status !== 'concluida');
  if (L) {
    if (L.stage === 2 && L.status === 'aguardando') { L.stage = 3; L.status = 'andamento'; touch(L); L.asbuiltPending = false; notify(L.assignee, `As Built do RM ${rm.rm} concluído. O laudo voltou para sua esteira (avaliação imobiliária).`, rm.id); }
    else if (L.stage === 6) {
      const u = U(L.sentBy);
      if (!L.sentBy || u.inativo) { L.assignee = null; L.status = 'entrada'; notifySetorLeader('laudo', `RM ${rm.rm} caiu na caixa "Revisão do As Built" (responsável original inativo).`, rm.id); addFeed(rm, 'encaminhado', 'Revisão do As Built enviada para a caixa "Revisão do As Built": quem enviou o laudo está inativo.', { tgt: 'laudo' }); }
      else { L.assignee = L.sentBy; L.status = 'andamento'; notify(L.sentBy, `As Built do RM ${rm.rm} concluído. Revise avaliação e laudo para finalizar.`, rm.id); addFeed(rm, 'encaminhado', `Revisão do As Built voltou para ${u.nome}.`, { tgt: 'laudo' }); }
      touch(L);
    } else { L.asbuiltPending = false; touch(L); if (L.assignee) notify(L.assignee, `As Built do RM ${rm.rm} concluído.`, rm.id); }
  }
  S.dem.filter(x => x.setor === 'evtl' && x.rmId === rm.id && x.status === 'aguardando').forEach(e => { e.stage = 2; e.status = 'andamento'; e.waitKind = null; touch(e); notify(e.assignee, `Desenho do RM ${rm.rm} pronto. EVTL liberado na sua esteira.`, rm.id); addFeed(rm, 'encaminhado', `EVTL voltou para a esteira de ${U(e.assignee).nome}.`, { tgt: 'evtl' }); });
}

const A = {

  open(ds) { (UI.hist = UI.hist || []).push(UI.view); UI.view = { name: 'rm', id: ds.rm, d: ds.d }; UI.notif = false; UI.navOpen = false; render(); const el = ds.d && document.getElementById('dem-' + ds.d); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); },

  },

    });

  legacy(ds) {

      onOk(v) {
        const cs = [];
        for (let i = 1; i < n; i++) { const valor = parseBRL(v['valor' + i]); if (!(valor > 0)) return `Informe o valor da ${i}ª vistoria.`; if (!v['data' + i]) return `Informe a data de entrega da ${i}ª vistoria.`; const at = new Date(v['data' + i] + 'T12:00').getTime(); if (at > Date.now()) return `A data de entrega da ${i}ª vistoria não pode ser no futuro.`; cs.push({ eng: rm.eng, desenho: rm.desenho, dv: at - 10 * D, n: i, status: 'concluida', valor, resp: v['resp' + i], desc: v['desc' + i].trim(), at, legado: true }); }

      body: `<div class="f c4"><label>O que está faltando <span class="req">*</span></label><div class="wpick">${DOCI.map(([k, l]) => `<label><input type="checkbox" name="itens" value="${k}"> ${l}</label>`).join('')}</div></div>` + fIn('outro', 'Falta outros: descreva', false, 'placeholder="ex.: matrícula do imóvel"', 'c4') + fSel('prazo', 'Prazo', [['24', '24 horas (padrão)'], ['48', '48 horas'], ['72', '72 horas'], ['120', '5 dias']], '24') + fTA('obs', 'Observação', false, 'ex.: engenheiro avisado por WhatsApp'),
      ok: 'Abrir ocorrência',

        S.pend.push(pd); d.pendId = pd.id;

  },
  matok(ds) { const d = dem(ds.id); const pd = S.pend.find(p => p.id === d.pendId) || S.pend.filter(p => p.rmId === d.rmId && !p.resolvedAt).pop(); if (pd) pd.resolvedAt = Date.now(); d.pendId = null; d.status = 'andamento'; d.waitKind = null; d.waitUntil = null; touch(d); addFeed(rmOf(d), 'material', `Documentação regularizada pelo engenheiro${pd ? ` em ${dur(pd.resolvedAt - pd.at)}: ${docTxt(pd)}` : ''}.`); commit(); toast('Ocorrência encerrada.'); },
  croquiok(ds) { const d = dem(ds.id); d.stage = 3; touch(d); addFeed(rmOf(d), 'etapa', 'Croqui desenhado. Etapa: Avaliação imobiliária.'); commit(); },
  toab(ds) {
    const d = dem(ds.id), rm = rmOf(d);
    const ab = newDem(rm, { setor: 'asbuilt', tipo: 'asbuilt', cycle: d.cycle });
    notifySetorLeader('asbuilt', `Novo desenho As Built: ${rmTitle(rm, d.cycle)}`, rm.id);
    if (ds.m === 'wait') { d.status = 'aguardando'; d.waitKind = 'asbuilt'; addFeed(rm, 'encaminhado', 'Encaminhado ao As Built. Laudo aguarda o desenho para seguir.', { tgt: 'asbuilt' }); }
    else { d.asbuiltPending = true; d.stage = 3; addFeed(rm, 'encaminhado', 'Encaminhado ao As Built em paralelo. Laudo segue para avaliação imobiliária.', { tgt: 'asbuilt' }); }

  },
  skipab(ds) { const d = dem(ds.id); d.status = 'andamento'; d.waitKind = null; d.stage = 3; d.asbuiltPending = true; touch(d); addFeed(rmOf(d), 'etapa', 'Seguiu para avaliação imobiliária com As Built pendente.'); commit(); },
  step(ds) {

function renderVRM() {
  const m = me(); if (!['dados', 'adm'].includes(m.setor)) return `<div class="page"><div class="empty">Disponível para ADM e Análise de dados.</div></div>`;

    .filter(x => !q || norm([x.rm.rm, x.rm.bairro, x.rm.cidade, x.rm.uf, ENG(x.rm.eng).nome].join(' ')).includes(q))
    .sort((a, b) => b.done.length - a.done.length || Math.max(...b.cs.map(x => x.t)) - Math.max(...a.cs.map(x => x.t)));

function contatoModal(rmId, cid) {

/* ================== A realizar pela esteira + fechamento mensal (entrega × gordura) ================== */
const abertasEsteira = () => S.dem.filter(d => !rmOf(d).cancelado && d.status !== 'concluida' && d.setor !== 'correcao');
function resumoEsteira(V) {
  const r = V.items.filter(x => x.done).length, o = abertasEsteira(), q = o.filter(d => d.status === 'entrada').length, ag = V.items.filter(x => !x.done).length;

const cfg = () => (S.cfg = S.cfg || { base: 'meta', metas: { laudo: 20, asbuilt: 9000, evtl: 6, bens: 10 } });
const metaAB = () => +cfg().metas.asbuilt || 9000;
const UNI = { laudo: 'laudos', asbuilt: 'm²', evtl: 'EVTLs', bens: 'propostas' };
const fmtU = (T, v) => T === 'asbuilt' ? m2f(v) : `${Math.round(v)}`;
function ledger(T, nMonths = 6) {
  const now = Date.now(), L = S.dem.filter(d => d.setor === T && !rmOf(d).cancelado), val = d => T === 'asbuilt' ? (d.m2c || 0) : 1;
  const cur = mesW(now); let a = cur[0]; const ms = [];
  for (let i = 0; i < 12; i++) { ms.unshift(mesW(a)); a = mesW(a - 1)[0]; }
  const firstData = Math.min(...L.map(d => d.createdAt), now);
  const useRec = cfg().base === 'recebidas' && T !== 'asbuilt';
  let credit = 0; const rows = [];
  ms.filter(([, b]) => b > firstData).forEach(([a, b]) => {
    const fin = L.filter(d => d.status === 'concluida' && doneAt(d) >= a && doneAt(d) < b).reduce((s, d) => s + val(d), 0);
    const rec = L.filter(d => d.createdAt >= a && d.createdAt < b).length;
    const quota = useRec ? rec : (+cfg().metas[T] || 0), vindo = credit, avail = fin + credit, ent = Math.min(avail, quota); credit = avail - ent;
    const end = Math.min(b, now), gord = L.filter(d => d.createdAt < end && (d.status !== 'concluida' || doneAt(d) >= end));
    rows.push({ a, b, cur: b > now, quota, rec, fin, vindo, ent, adi: credit, gord: gord.length, gCaixa: gord.filter(d => d.status === 'entrada').length });
  });
  return rows.slice(-nMonths);
}
const mesNome = a => `${MESES[new Date(a).getMonth()]}${new Date(a).getFullYear() !== new Date().getFullYear() ? '/' + new Date(a).getFullYear() : ''}`;

  ${R.slice().reverse().map(r => `<tr class="${r.cur ? 'curm' : ''}"><td><b>${mesNome(r.a)}</b>${r.cur ? ` <span class="pill acc">até ${fd(Date.now())}</span>` : ''}</td><td class="mono">${fmtU(T, r.quota)}</td><td class="mono">${fmtU(T, r.fin)}</td><td class="mono">${r.vindo ? '+' + fmtU(T, r.vindo) : '—'}</td><td class="mono"><b>${fmtU(T, r.ent)}</b>${r.quota ? ` <span class="muted">(${Math.round(r.ent / r.quota * 100)}%)</span>` : ''}</td><td class="mono">${r.adi ? `<span class="pill ok">+${fmtU(T, r.adi)}</span>` : '—'}</td><td class="mono">${r.gord} <span class="muted">(${r.gCaixa} na caixa)</span></td><td class="mono"><b>${T === 'asbuilt' ? `${r.gord} req.${r.adi ? ' + ' + m2f(r.adi) : ''}` : r.gord + Math.round(r.adi)}</b></td></tr>`).join('')}
  </tbody></table></div>`;
}
const FECH_TW = { fech: { t: 'Fechamento do mês · entregas × gordura', l: true, r(ts) {
  const rows = ts.filter(T => TEAMS.includes(T)).map(T => { const r = ledger(T, 1)[0] || { quota: 0, fin: 0, vindo: 0, ent: 0, adi: 0, gord: 0, gCaixa: 0 }; return [T, r]; });
  return `<div class="tablewrap" style="border:0"><table class="list" style="min-width:760px"><thead><tr><th>Equipe</th><th>Meta / base</th><th>Entregues no mês</th><th>Adiantadas</th><th>Gordura (não finalizadas)</th><th>Situação</th></tr></thead><tbody>${rows.map(([T, r]) => `<tr data-a="go" data-v='{"name":"fech"}'><td>${setorTag(T)}</td><td class="mono">${fmtU(T, r.quota)}</td><td class="mono"><b>${fmtU(T, r.ent)}</b></td><td class="mono">${r.adi ? '+' + fmtU(T, r.adi) : '—'}</td><td class="mono">${r.gord}</td><td>${r.ent >= r.quota && r.quota ? pill(['ok', r.adi ? 'Meta batida · adiantada' : 'Meta batida']) : pill(['warn', `Faltam ${fmtU(T, r.quota - r.ent)}`])}</td></tr>`).join('')}</tbody></table></div><p class="note" style="margin:8px 0 0">Mês de ${MESES[new Date().getMonth()]} até ${fdt(Date.now())}. Detalhes por mês em "Fechamento mensal".</p>`; } } };
Object.assign(TW, FECH_TW);

  </section>

}
